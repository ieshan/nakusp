services:
  test:
    image: golang:1.27.1-trixie
    working_dir: /app
    volumes:
      - "./:/app"
    networks:
      - nakusp-network
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    command:
      - "sh"
      - "-c"
      - "rm -f go.work go.work.sum && go work init . ./transports/redis ./transports/sqlite ./transports/postgres && go mod download && for mod in . ./transports/redis ./transports/sqlite ./transports/postgres; do (cd $$mod && go test -v ./...) || exit 1; done"
    stop_signal: SIGINT
    environment:
      REDIS_URI: "redis://redis:6379/0"
      POSTGRES_DSN: "postgres://postgres@postgres:5432/nakusp?sslmode=disable"
  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.0
    ulimits:
      memlock: -1
    networks:
      - nakusp-network
    restart: unless-stopped
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: nakusp
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakusp"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - nakusp-network
networks:
  nakusp-network:
    driver: bridge
